<svg fill="none" viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bg-obsidian" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    
    <radialGradient id="mesh-cyan" cx="0.76" cy="0.48" r="0.46">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#040508" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh-purple" cx="0.82" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#EC4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040508" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mesh-left" cx="0.12" cy="0.15" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#040508" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="glass-rim" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    
    <linearGradient id="title-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="title-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    
    <linearGradient id="ring-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ring-grad-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85" />
    </linearGradient>

    
    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <pattern id="micro-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#FFFFFF" fill-opacity="0.07" />
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .ring-outer { animation: rotateCW 24s linear infinite; transform-origin: 930px 210px; }
      .ring-mid { animation: rotateCCW 16s linear infinite; transform-origin: 930px 210px; }
      .ring-inner { animation: rotateCW 10s linear infinite; transform-origin: 930px 210px; }
      .core-breathe { animation: breathe 4s ease-in-out infinite; transform-origin: 930px 210px; }
      .status-led { animation: pulseDot 2s ease-in-out infinite; }
    </style>
  </defs>

  
  <rect width="1200" height="420" rx="24" fill="url(#bg-obsidian)" />
  <rect width="1200" height="420" rx="24" fill="url(#micro-dots)" />
  <rect width="1200" height="420" rx="24" fill="url(#mesh-left)" />
  <rect width="1200" height="420" rx="24" fill="url(#mesh-cyan)" />
  <rect width="1200" height="420" rx="24" fill="url(#mesh-purple)" />
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="url(#glass-rim)" stroke-width="1.5" />

  
  <g>
    
    <circle cx="930" cy="210" r="115" fill="url(#title-aurora)" opacity="0.22" filter="url(#soft-blur)" class="core-breathe" />

    
    <circle cx="930" cy="210" r="154" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
    <circle cx="930" cy="210" r="142" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 10" />

    
    <g class="ring-outer" filter="url(#glow-line)">
      <circle cx="930" cy="210" r="126" stroke="url(#ring-grad-1)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="190 90 40 90" />
      <circle cx="930" cy="84" r="4.5" fill="#00F0FF" />
      <circle cx="930" cy="336" r="4.5" fill="#E879F9" />
    </g>

    
    <g class="ring-mid" filter="url(#glow-line)">
      <circle cx="930" cy="210" r="98" stroke="url(#ring-grad-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="130 70 25 70" />
      <circle cx="1028" cy="210" r="3.5" fill="#34D399" />
    </g>

    
    <g class="ring-inner">
      <circle cx="930" cy="210" r="72" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="12 8" />
    </g>

    
    <circle cx="930" cy="210" r="52" fill="#090D16" fill-opacity="0.85" stroke="url(#glass-rim)" stroke-width="1.5" />
    <text x="930" y="206" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">智云中枢</text>
    <text x="930" y="225" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#38BDF8" letter-spacing="1">CORE.AI</text>

    
    
    <g transform="translate(705, 76)">
      <rect width="146" height="34" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.35" />
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8" />
      <text x="28" y="21" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">10,000+ 边缘节点</text>
    </g>

    
    <g transform="translate(1008, 308)">
      <rect width="150" height="34" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#C084FC" stroke-opacity="0.35" />
      <circle cx="16" cy="17" r="3.5" fill="#C084FC" />
      <text x="28" y="21" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">4× M系列 本地集群</text>
    </g>

    
    <g transform="translate(698, 308)">
      <rect width="146" height="34" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.35" />
      <circle cx="16" cy="17" r="3.5" fill="#34D399" />
      <text x="28" y="21" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">440 核 裸金属算力</text>
    </g>
  </g>

  
  <g transform="translate(64, 56)">
    
    <rect x="0" y="0" width="256" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12" />
    <circle cx="18" cy="15" r="4" fill="#34D399" class="status-led" />
    <text x="32" y="19" class="sans" font-size="11.5" font-weight="600" fill="#CBD5E1" letter-spacing="0.8">全栈系统架构与分布式算力引擎</text>

    
    <text x="0" y="92" class="sans" font-size="46" font-weight="800" fill="url(#title-silver)" letter-spacing="-0.5">全栈系统与</text>
    <text x="0" y="148" class="sans" font-size="46" font-weight="800" fill="url(#title-aurora)" letter-spacing="-0.5">基础设施架构师</text>

    
    <text x="0" y="196" class="sans" font-size="16" fill="#94A3B8" font-weight="400">专注于大规模分布式节点集群编排、跨区域多跳加密隧道网络、</text>
    <text x="0" y="222" class="sans" font-size="16" fill="#94A3B8" font-weight="400">底层嵌入式软路由定制以及本地 Apple Silicon 大模型推理集群。</text>

    
    <g transform="translate(0, 266)">
      <rect x="0" y="0" width="154" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16" />
      <text x="77" y="23" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#FFFFFF">zhincloud.cn ↗</text>

      <rect x="168" y="0" width="154" height="38" rx="10" fill="transparent" stroke="#FFFFFF" stroke-opacity="0.12" />
      <text x="245" y="23" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#94A3B8">verkrons.com ↗</text>

      <text x="346" y="23" class="sans" font-size="12.5" fill="#64748B">中国大陆 / 香港混合边缘节点</text>
    </g>
  </g>
</svg>
